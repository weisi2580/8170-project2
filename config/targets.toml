# Targets and pipeline settings.
# Residue ranges (eu) use CASP target-sequence numbering (1 = first residue of the FASTA).

[settings]
# Leakage control: templates released after this date are excluded, in addition
# to the target's own PDB entry. CASP15 modeling season opened May 2022.
# Set to "" to only exclude the target entry.
template_release_cutoff = "2022-05-01"

# Template search: iterative profile HMM search (HMMER jackhmmer) against PDB chains
# released before the cutoff. Each round builds a profile from hits with
# E <= inclusion_evalue and searches again; hits with E <= evalue_cutoff are reported.
search_iterations = 3
inclusion_evalue = 1e-3
evalue_cutoff = 1.0
identity_cutoff = 0.0
max_hits = 250
n_detailed = 10                # top candidates downloaded to check missing residues

# MODELLER (target-template alignment comes from the search profile)
n_models = 5

# Ranking weights (each signal is scaled to 0..1 before weighting)
[settings.rank_weights]
identity = 0.40
coverage = 0.30
evalue = 0.10
resolution = 0.10
completeness = 0.10

[[targets]]
id = "T1124"
difficulty = "TBM-easy"
pdb = "7UX8"
chain = ""          # empty = pick the chain that best matches the target sequence
length = 384
eu = [7, 384]

[[targets]]
id = "T1127"
difficulty = "TBM-hard"
pdb = "8XBP"
chain = ""
length = 211
